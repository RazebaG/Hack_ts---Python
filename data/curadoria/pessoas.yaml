id: "pessoas"
nome: "Pessoas (RH)"
destaques:
  - titulo: "Antecedência mínima para solicitação de férias"
    valor: "45 dias corridos"
    aviso: "v2 (substituída) dizia 30 dias"
    fonte:
      codigo: "NG_111"
      versao: "3.0.0"
      secao: "4.3.1"
      trecho: "A solicitação é formal e feita no Portal Raiz (FM_1111-001) com antecedência mínima de 45 dias corridos do início de gozo."
    fonte_anterior:
      codigo: "NG_111"
      versao: "2.0.0"
      secao: "2.3"
      trecho: "A solicitação deve ser feita com antecedência mínima de 30 dias"
  - titulo: "Fracionamento das férias em até 3 períodos"
    valor: "Até 3 períodos"
    fonte:
      codigo: "NG_111"
      versao: "3.0.0"
      secao: "Anexo C"
      trecho: "Um empregado com 30 dias de férias pode dividi-los em até 3 períodos. A divisão em 14, 8 e 8 dias é válida, porque um período tem pelo menos 14 dias e os demais têm pelo menos 5 dias."
valores:
  - rotulo: "Limite de ressarcimento por alteração por necessidade de serviço"
    numero: 2500.0
    unidade: "BRL"
    fonte:
      codigo: "NG_111"
      versao: "3.0.0"
      secao: "Anexo C"
      trecho: "A ACME ressarce o valor integral, porque ele está dentro do limite de R$ 2.500,00 por evento. Se a despesa comprovada fosse de R$ 3.000,00, o ressarcimento seria limitado a R$ 2.500,00."
  - rotulo: "Dias de abono pecuniário permitidos"
    numero: 10.0
    unidade: "dias"
    fonte:
      codigo: "NG_111"
      versao: "3.0.0"
      secao: "Anexo C"
      trecho: "O empregado que converte 10 dias em abono pecuniário faz o pedido na mesma solicitação de férias, e o valor é pago junto com as férias."
prazos:
  - data: "2027-03-21"
    evento: "Último dia para solicitar as férias pelo empregado"
    marco: "D-45"
    cenario: "Exemplo PX_1111-001: férias a partir de 05/05/2027"
    fonte:
      codigo: "PX_1111-001"
      versao: "1.0.0"
      secao: "Anexo B"
      trecho: "D-45 | Último dia para solicitar as férias | Empregado"
  - data: "2027-03-31"
    evento: "Último dia para a GGC emitir o aviso de férias"
    marco: "D-35"
    cenario: "Exemplo PX_1111-001: férias a partir de 05/05/2027"
    fonte:
      codigo: "PX_1111-001"
      versao: "1.0.0"
      secao: "Anexo B"
      trecho: "D-35 | Último dia para a GGC emitir o aviso | GGC"
  - data: "2027-04-05"
    evento: "Último dia para o empregado assinar o aviso de férias"
    marco: "D-30"
    cenario: "Exemplo PX_1111-001: férias a partir de 05/05/2027"
    fonte:
      codigo: "PX_1111-001"
      versao: "1.0.0"
      secao: "Anexo B"
      trecho: "D-30 | Último dia para o empregado assinar o aviso | Empregado"
  - data: "2027-04-15"
    evento: "Último dia para alteração ou cancelamento por iniciativa do empregado com anuência do gestor"
    marco: "D-20"
    cenario: "Exemplo PX_1111-001: férias a partir de 05/05/2027"
    fonte:
      codigo: "PX_1111-001"
      versao: "1.0.0"
      secao: "Anexo B"
      trecho: "D-20 | Último dia para alteração ou cancelamento por iniciativa do empregado, com anuência do gestor | Empregado e gestor"
  - data: "2027-04-30"
    evento: "Último dia para o pagamento das férias pela GFI (antecipado para dia útil anterior)"
    marco: "D-3"
    cenario: "Exemplo PX_1111-001: férias a partir de 05/05/2027"
    fonte:
      codigo: "PX_1111-001"
      versao: "1.0.0"
      secao: "Anexo B"
      trecho: "D-3 | Último dia para o pagamento (antecipado para o dia útil anterior se cair em sábado, domingo ou feriado) | GFI"
responsaveis:
  - papel: "Empregado"
    responsabilidade: "Solicitar férias no Portal Raiz com no mínimo 45 dias corridos de antecedência (D-45) e assinar aviso até D-30"
    fonte:
      codigo: "PX_1111-001"
      versao: "1.0.0"
      secao: "Anexo B"
      trecho: "D-45 | Último dia para solicitar as férias | Empregado"
  - papel: "Gestor"
    responsabilidade: "Decidir sobre a solicitação de férias em até 7 dias corridos do recebimento"
    fonte:
      codigo: "PX_1111-001"
      versao: "1.0.0"
      secao: "Anexo B"
      trecho: "Os prazos de decisão do gestor (7 dias corridos após a solicitação) e do diretor da área (3 dias úteis após a escalada) não se contam a partir do início de gozo, e sim a partir da solicitação e da escalada."
  - papel: "GGC"
    responsabilidade: "Conferir saldo de férias e emitir aviso até D-35"
    fonte:
      codigo: "PX_1111-001"
      versao: "1.0.0"
      secao: "Anexo B"
      trecho: "D-35 | Último dia para a GGC emitir o aviso | GGC"
  - papel: "Diretor da área"
    responsabilidade: "Decidir em até 3 dias úteis sobre solicitações não decididas pelo gestor e autorizar alterações a partir de D-19"
    fonte:
      codigo: "PX_1111-001"
      versao: "1.0.0"
      secao: "Anexo B"
      trecho: "D-19 em diante | Alteração apenas por necessidade de serviço, por decisão do diretor da área | Diretor da área"
  - papel: "GFI"
    responsabilidade: "Pagar férias, 1/3 constitucional e abono pecuniário até D-3"
    fonte:
      codigo: "PX_1111-001"
      versao: "1.0.0"
      secao: "Anexo B"
      trecho: "D-3 | Último dia para o pagamento (antecipado para o dia útil anterior se cair em sábado, domingo ou feriado) | GFI"
riscos:
  - descricao: "Solicitação com menos de 45 dias de antecedência exige justificativa excepcional e aprovação expressa do diretor da área"
    fonte:
      codigo: "NG_111"
      versao: "3.0.0"
      secao: "4.3.1"
      trecho: "A solicitação é formal e feita no Portal Raiz (FM_1111-001) com antecedência mínima de 45 dias corridos do início de gozo."
  - descricao: "Aviso de férias não assinado até D-30 impede o início do gozo e gera notificação ao gestor e ao diretor"
    fonte:
      codigo: "PX_1111-001"
      versao: "1.0.0"
      secao: "Anexo E"
      trecho: "O aviso não foi assinado até D-30. A GGC notifica o gestor e o diretor, e as férias não podem ser iniciadas sem o aviso assinado."
