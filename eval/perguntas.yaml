    resposta_curta_esperada: "35 dias"
    origem: "NG_111 4.5.3"

  # Perguntas frequentes do CTR_2026-012 Apêndice J
  - id: faq_ctr_vigencia
    pergunta: "Qual a vigência do contrato de coworking?"
