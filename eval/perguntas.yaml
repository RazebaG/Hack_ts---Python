# Dataset de avaliação de perguntas e respostas sobre o acervo normativo (HACKA/TS 2026)
# Mínimo de 15 perguntas tiradas de "Perguntas frequentes" / "Apêndice J" e cenas 1-3 do PRD.
# Avaliação >= 80% com citação correta e 100% de abstenção correta.

perguntas:
  # Cena 1 do PRD: D-45 de 05/05/2027 = 21/03/2027 citando PX_1111-001 (ou NG_111 Anexo C)
  - id: cena_1_prazo_ferias
    pergunta: "Até quando peço férias que começam em 05/05/2027?"
    perfil: "empregado"
    consta: true
    codigo_esperado: "PX_1111-001"
    resposta_curta_esperada: "21/03/2027"
    origem: "PRD Cena 1 / PX_1111-001 Anexo D"

  # Cena 2 do PRD: aviso de NG_111 v2.0.0 substituída
  - id: cena_2_antecedencia_aviso
    pergunta: "Qual a antecedência mínima para pedir férias?"
    perfil: "rh"
    consta: true
    codigo_esperado: "NG_111"
    resposta_curta_esperada: "45 dias"
    aviso_esperado: "NG_111 v2.0.0 foi substituída pela v3.0.0"
    origem: "PRD Cena 2 / NG_111 Anexo F"

  # Cena 3 do PRD: Abstenção (regra de segregação de funções do catálogo excluído)
  - id: cena_3_abstencao_mesma_pessoa
    pergunta: "Uma mesma pessoa pode elaborar, revisar e aprovar?"
    perfil: "gestor"
    consta: false
    codigo_esperado: null
    resposta_curta_esperada: "não trata disso"
    origem: "PRD Cena 3 / Catálogo §3 (fora do índice)"

  # Perguntas frequentes do NG_111 Anexo F
  - id: faq_ng111_fracionamento
    pergunta: "Em quantos períodos posso dividir as férias?"
    perfil: "empregado"
    consta: true
    codigo_esperado: "NG_111"
    resposta_curta_esperada: "3 períodos"
    origem: "NG_111 Anexo F"

  - id: faq_ng111_abono
    pergunta: "Posso converter dias de férias em abono?"
    perfil: "empregado"
    consta: true
    codigo_esperado: "NG_111"
    resposta_curta_esperada: "10 dias"
    origem: "NG_111 Anexo F"

  - id: faq_ng111_decisao_gestor
    pergunta: "Em quanto tempo decido um pedido de férias?"
    perfil: "gestor"
    consta: true
