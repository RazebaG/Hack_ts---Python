# Manifest do app Slack (workspace de teste). Cole em https://api.slack.com/apps → "From a manifest".
display_information:
  name: Acervo de Normas
  description: Assistente do Arquivo Central de Normas (respostas com citação)
features:
  bot_user:
    display_name: acervo
    always_online: false
  slash_commands:
    - command: /acervo
      description: Pergunte ao acervo ou veja o radar
      usage_hint: "<pergunta> | radar [perspectiva]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
